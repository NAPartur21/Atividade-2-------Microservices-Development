spring.application.name=ms-av-02-seguranca-observabilidade
server.port=8080
server.error.include-message=always

# Banco H2 em memoria (schema.sql + data.sql sao executados na subida)
spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# 02 - Metricas: Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# 01 - Documentacao: Swagger UI em /swagger-ui.html, JSON em /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
